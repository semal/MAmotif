[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mamotif"
version = "0.2.0"
description = "Integrate MotifScan results with MAnorm ChIP-seq binding-signal changes"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Shao Lab / MAmotif contributors" },
]
keywords = ["ChIP-seq", "motif", "MAnorm", "bioinformatics", "transcription-factor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "pandas>=1.3",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.3"]
dev = ["pytest>=7.0", "matplotlib>=3.3"]

[project.scripts]
mamotif = "MAmotif:main"

[project.urls]
Homepage = "https://github.com/semal/MAmotif"
Repository = "https://github.com/semal/MAmotif"

[tool.setuptools]
py-modules = [
    "MAmotif",
    "constant",
    "jaspar3",
    "gene_set_analysis",
    "peak_set_analysis",
    "MAmotif_fisher_test",
    "io_related",
    "daily_used_programs",
    "jaspar3_motifs_classified_peaks_test_result",
]
include-package-data = true

[tool.setuptools.packages.find]
include = ["MAmotif_pkg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
